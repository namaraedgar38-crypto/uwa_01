services:
  - type: web
    name: uwa-01
    runtime: python
    plan: free
    rootDir: UWA
    buildCommand: ./build.sh
    startCommand: gunicorn UWA.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
