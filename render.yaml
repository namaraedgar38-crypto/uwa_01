services:
  - type: web
    name: uwa-01
    runtime: python
    plan: free
    buildCommand: cd UWA && ./build.sh
    startCommand: cd UWA && gunicorn UWA.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: uwa-01-7.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://uwa-01-7.onrender.com
